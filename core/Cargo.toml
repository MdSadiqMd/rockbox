[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/msgpack",
    "crates/cache",
    "crates/kernel",
    "crates/engine",
    "crates/compiler",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Rockbox"]
license = "Apache-2.0"
repository = "https://github.com/rockbox/rockbox"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
msgpack  = { path = "crates/msgpack" }
cache    = { path = "crates/cache" }
kernel   = { path = "crates/kernel" }

# Runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "fs", "process", "sync", "time", "signal"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
rmp-serde  = "1.3"
rmpv       = { version = "1.3", features = ["with-serde"] }

# Error handling
thiserror  = "2.0"
anyhow     = "1.0"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Crypto / hashing
sha2 = "0.10"
hex  = "0.4"
blake3 = "1.5"

# Time + IDs
uuid    = { version = "1.11", features = ["v4", "serde"] }

# Concurrency primitives
parking_lot = "0.12"
crossbeam   = "0.8"
once_cell   = "1.20"
dashmap     = "6.1"

# I/O helpers
bytes = "1.8"
memmap2 = "0.9"
base64 = "0.22"

# CLI / config
clap = { version = "4.5", features = ["derive", "env"] }

# Linux primitives (cfg-gated in code)
libc        = "0.2"
nix         = { version = "0.29", features = ["sched", "mount", "fs", "process", "signal", "user", "resource", "socket", "uio", "ioctl", "mman", "feature"] }
caps        = "0.5"
seccompiler = "0.5"
cgroups-rs  = "0.3"
io-uring    = "0.7"

# Testing
proptest = "1.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro    = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo         = "warn"
unimplemented = "warn"
unwrap_used   = "warn"
expect_used   = "allow"
missing_const_for_fn = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
type_complexity = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"
debug         = 1
opt-level     = 3

[profile.release-fat]
inherits      = "release"
lto           = "fat"

[profile.dev]
opt-level = 1
debug     = true

[profile.dev.package."*"]
opt-level = 2
