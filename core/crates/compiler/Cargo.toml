[package]
name = "compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Privileged compile process. Holds write access to /var/cache/sandbox/bin. Talks to engine over unix-domain socket. Runs `bwrap`-driven compiles with relaxed-compiler seccomp."

[[bin]]
name = "compiler"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
protocol = { workspace = true }
msgpack  = { workspace = true }

tokio              = { workspace = true }
serde              = { workspace = true }
rmp-serde          = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
uuid               = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
nix  = { workspace = true }
