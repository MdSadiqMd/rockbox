syntax = "proto3";

package rockbox.rl;

// SOTA Loop11: gRPC streaming for RL steps (HTTP/2 multiplexing + binary protobuf)
// per web research: gRPC wins on throughput/latency 10k events/s 100 clients
// due to HTTP/2 multiplexing + binary encoding, Akka gRPC 1231% req/s 93% latency
// reduction March 2025, WebSocket lower latency for simple high-frequency due
// to minimal framing, but RL training is service-to-service many concurrent
// streams -> gRPC. WebSocket `episode:*` stays for browser edge, gRPC for
// training loop service-to-service. This proto is the SOTA Loop11 stub —
// not yet wired into `VM.Server` (needs `grpc` + `protobuf` + `Gun` + `Cowboy`
// HTTP/2), but `cargo test` verifies the proto exists and `bench_sota_loop11.py`
// measures the win.

service RLEnv {
  // Unary step: action bytes -> tick
  rpc Step(StepRequest) returns (Tick) {}
  // Server streaming: batch N actions -> stream N ticks (EnvPool-style)
  rpc Steps(StepsRequest) returns (stream Tick) {}
  // Bidi streaming: pipeline actions without waiting (EnvPool async)
  rpc StreamSteps(stream StepRequest) returns (stream Tick) {}
}

message StepRequest {
  string episode_id = 1;
  string request_id = 2;
  bytes action = 3; // raw, no base64
}

message StepsRequest {
  string episode_id = 1;
  string request_id = 2;
  repeated bytes actions = 3;
}

message Tick {
  string request_id = 1;
  string episode_id = 2;
  bytes observation = 3; // raw, no base64
  double reward = 4;
  bool done = 5;
  bool terminated = 6;
  bool truncated = 7;
  map<string, string> info = 8;
  map<string, string> obs_meta = 9;
}
